# The F2 reader as a uv project: `uv sync --no-editable` here makes the
# environment the reader runs in (uv.lock) and builds its compiled part, which
# runs the model and holds its states (meson.build), into it; f2serve.py's
# header says the rest.
[project]
name = "episteme-f2"
version = "0.1.0"
description = "episteme's F2 reader: BM25 fused with attention read out of Qwen3.5-0.8B"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tokenizers==0.23.3",
]

# fit.py, which makes the book states are coded by once a store, does its sums with PyTorch (--group fit)
[dependency-groups]
fit = [
    "torch==2.6.0+cu124",
]

[build-system]
requires = ["meson-python>=0.17", "meson>=1.5", "ninja"]
build-backend = "mesonpy"

[tool.uv]
# the package is rebuilt when what it is built from changes
cache-keys = [{ file = "pyproject.toml" }, { file = "meson.build" }, { file = "native/*" }]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
